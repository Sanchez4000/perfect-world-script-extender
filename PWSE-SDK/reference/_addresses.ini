# Референсная копия библиотеки адресов PWSE.
#
# Назначение: справочник доступных функций движка (имена и сигнатуры) для
# разработки плагина. В сборке плагина НЕ участвует.
#
# Авторитетная копия находится на сервере: gamed/plugins/_addresses.ini, а также
# в каждом релизе (PWSE-Release/<версия>/plugins/_addresses.ini). Данный файл
# следует периодически синхронизировать с серверной копией.
#
# Формат строки:
#   <имя> = 0xАДРЕС   ; сигнатура
# Строки, начинающиеся с '#' или ';', игнорируются.

gplayer_imp::SendNormalChat = 0x080ab21e ; (void* self, char channel, const void* msg, uint msglen, const void* p2, uint l2)
gplayer_imp::ResetInstance  = 0x080a1e6c ; (void* self, int worldTag)
world_manager::GetWorldTag  = 0x0805f8a2 ; (void) -> int
